name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: type check, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Strict TypeScript check
        run: npm run check
      - name: Unit tests (bracket, aliases, AI)
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    name: container serves the SPA over HTTPS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build
      - name: HTTPS answers on 8443
        run: |
          for _ in $(seq 1 30); do curl -skf -o /dev/null https://localhost:8443/ && exit 0; sleep 2; done
          docker compose logs; exit 1
      - name: Deep links fall back to index.html (History API router)
        run: curl -skf https://localhost:8443/tournament | grep -q '<main id="app">'
      - name: Tear down
        if: always()
        run: docker compose down
